<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#16161c"/>
<link rel="apple-touch-icon" href="/icon.png"/>
<title>FurryManager</title>
<style>
  :root { --bg:#16161c; --bg2:#1e1e26; --bg3:#262631; --text:#e8e6e3; --muted:#9a97a3; --accent:#f28c38; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  /* html-фон: когда body фиксируется (открыт арт), под ним не должно просвечивать
     светлое — иначе внизу мелькает серый прямоугольник */
  html { background:#16161c; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; }
  header {
    position:sticky; top:0; z-index:10; background:var(--bg2);
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  }
  header input[type=search] {
    flex:1; min-width:120px; background:var(--bg3); border:1px solid #34343f;
    border-radius:10px; color:var(--text); padding:9px 12px; font-size:16px; outline:none;
  }
  header select {
    background:var(--bg3); border:1px solid #34343f; border-radius:10px;
    color:var(--text); padding:8px 6px; font-size:14px; max-width:34vw;
  }
  header button {
    background:var(--accent); border:none; border-radius:10px; color:#1b1206;
    font-size:18px; font-weight:700; padding:8px 13px;
  }
  header button.ghost { background:var(--bg3); color:var(--text); }
  #grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr));
    gap:3px; padding:3px;
  }
  #grid .c { position:relative; aspect-ratio:1; background:var(--bg2); overflow:hidden; border-radius:4px; }
  #grid img {
    width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity .18s ease-out; /* превью проявляются, а не мелькают */
  }
  #grid img.ld { opacity:1; }
  #grid .ph { display:flex; align-items:center; justify-content:center; height:100%; font-size:32px; }
  #grid .b {
    position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.65);
    font-size:10px; padding:1px 5px; border-radius:5px;
  }
  #grid .b.off { left:auto; right:4px; bottom:auto; top:4px; color:var(--accent); }
  #status { text-align:center; color:var(--muted); padding:18px; font-size:13px; }
  #viewer { position:fixed; inset:0; background:rgba(8,8,12,1); z-index:50; overflow:hidden; }
  #vtrack { position:absolute; inset:0; display:flex; will-change:transform; }
  .vslide {
    flex:0 0 100vw; width:100vw; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .vslide img { max-width:100vw; max-height:100vh; object-fit:contain; }
  .vslide video { max-width:100vw; max-height:100vh; object-fit:contain; }
  /* Видео открыто: сверху освобождаем место под ✕/⬇ и нативную кнопку «на весь
     экран» (iOS рисует её в углу видео), снизу — под плёнку миниатюр, чтобы её
     не перекрывал ползунок перемотки. Плёнку НЕ прячем — она сидит под видео. */
  #viewer.on-video .vslide {
    box-sizing:border-box;
    padding: calc(env(safe-area-inset-top) + 54px) 0 calc(env(safe-area-inset-bottom) + 96px);
  }
  #viewer.on-video .vslide video { max-height:100%; max-width:100%; }
  #vstrip {
    position:fixed; left:0; right:0; bottom:0; z-index:52;
    display:flex; gap:4px; overflow-x:auto;
    padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(transparent, rgba(8,8,12,.9));
    -webkit-overflow-scrolling:touch;
  }
  #vstrip img, #vstrip .vph {
    width:40px; height:54px; object-fit:cover; border-radius:6px; flex:none;
    opacity:.5; border:2px solid transparent; transition:opacity .15s;
  }
  #vstrip .on { opacity:1; border-color:var(--accent); }
  #vstrip .vph { display:flex; align-items:center; justify-content:center; background:var(--bg3); font-size:16px; }
  #vclose {
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px;
    background:var(--bg3); color:var(--text); border:none; border-radius:50%;
    width:40px; height:40px; font-size:18px; z-index:51;
  }
  #vdl {
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:12px;
    background:var(--bg3); color:var(--text); border:none;
    border-radius:50%; width:40px; height:40px; font-size:18px; z-index:51;
    display:flex; align-items:center; justify-content:center;
  }
  body.locked { position:fixed; width:100%; overflow:hidden; }
  #setup {
    position:fixed; inset:0; background:var(--bg); z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center;
  }
  #setup input {
    width:100%; background:var(--bg3); border:1px solid #34343f; border-radius:10px;
    color:var(--text); padding:11px; font-size:16px;
  }
  #setup button { background:var(--accent); border:none; border-radius:10px; color:#1b1206; font-weight:700; padding:11px 22px; font-size:16px; }
  #setup .muted { color:var(--muted); font-size:13px; }
  #toast {
    position:fixed; bottom:calc(env(safe-area-inset-bottom) + 14px); left:50%;
    transform:translateX(-50%); background:var(--bg3); border:1px solid var(--accent);
    border-radius:12px; padding:10px 16px; font-size:14px; z-index:70; max-width:88vw;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <input id="q" type="search" placeholder="Поиск…" autocomplete="off"/>
  <select id="col"><option value="">📚 Все</option><option value="-1">📥 Без коллекции</option></select>
  <select id="nsfw"><option value="">Все</option><option value="0">🌱 SFW</option><option value="1">🔞 NSFW</option></select>
  <select id="sort" title="Порядок артов">
    <option value="">↓ Новые</option>
    <option value="old">↑ Старые</option>
    <option value="big">Крупные</option>
    <option value="small">Мелкие</option>
    <option value="views">Часто смотрю</option>
    <option value="random">🎲 Случайно</option>
  </select>
  <button id="refresh" class="ghost" title="Обновить (подтянуть изменения с ПК)">↻</button>
  <button id="offline" class="ghost" title="Офлайн-копия: скачать текущую коллекцию на телефон">⤓</button>
  <button id="add-link" class="ghost" title="Добавить по ссылке">🔗</button>
  <button id="add-file" title="Загрузить с телефона">＋</button>
</header>

<div id="grid"></div>
<div id="status"></div>

<div id="viewer" class="hidden">
  <button id="vclose">✕</button>
  <button id="vdl">⬇</button>
  <div id="vtrack">
    <div class="vslide"></div>
    <div class="vslide"></div>
    <div class="vslide"></div>
  </div>
  <div id="vstrip"></div>
</div>

<div id="setup" class="hidden">
  <div style="font-size:56px">🦊</div>
  <h2>FurryManager</h2>
  <div class="muted">Отсканируй QR из настроек приложения на ПК — или вставь токен вручную:</div>
  <input id="tok" placeholder="токен" autocomplete="off"/>
  <button id="tok-save">Подключиться</button>
</div>

<input type="file" id="file" accept="image/*,video/*" multiple hidden/>
<div id="toast" class="hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let TOKEN = params.get("token") || localStorage.getItem("fm_token") || "";
if (params.get("token")) {
  localStorage.setItem("fm_token", TOKEN);
  history.replaceState(null, "", "/");
}

// Манифест PWA — с токеном, чтобы «На экран Домой» открывалось уже подключённым
// Service Worker: нужен ТОЛЬКО для офлайн-запуска через Tailscale (https).
// Без Tailscale (http в локальной сети) он не нужен — и там его не будет:
// по http браузер SW не регистрирует, а если остался от прошлого — снимаем.
function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "https:") {
    navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW:", e));
  } else {
    navigator.serviceWorker.getRegistrations()
      .then((rs) => rs.forEach((r) => r.unregister()))
      .catch(() => {});
  }
}

function attachManifest() {
  if (!TOKEN) return;
  const l = document.createElement("link");
  l.rel = "manifest";
  l.href = "/manifest.json?token=" + encodeURIComponent(TOKEN);
  document.head.appendChild(l);
}

const st = { offset: 0, limit: 60, end: false, loading: false, items: [] };

// ---------- Офлайн-кэш (IndexedDB) ----------
// Service Worker недоступен: доступ идёт по http:// в локальной сети, а это не
// secure context. Поэтому кэшируем блобы сами и отдаём через object URL.
const DB_NAME = "fm-offline";
let _db = null;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs");   // key: "t123"/"m123"
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");     // key: "col:<id>" → {name, ids, at}
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function idbGet(store, key) {
  return idb().then((db) => new Promise((res, rej) => {
    const t = db.transaction(store, "readonly").objectStore(store).get(key);
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  }));
}
function idbPut(store, key, val) {
  return idb().then((db) => new Promise((res, rej) => {
    const t = db.transaction(store, "readwrite").objectStore(store).put(val, key);
    t.onsuccess = () => res();
    t.onerror = () => rej(t.error);
  }));
}
function idbDel(store, key) {
  return idb().then((db) => new Promise((res) => {
    const t = db.transaction(store, "readwrite").objectStore(store).delete(key);
    t.onsuccess = () => res();
    t.onerror = () => res();
  }));
}
function idbKeys(store) {
  return idb().then((db) => new Promise((res) => {
    const t = db.transaction(store, "readonly").objectStore(store).getAllKeys();
    t.onsuccess = () => res(t.result || []);
    t.onerror = () => res([]);
  }));
}

const objUrls = new Map(); // key → objectURL (чтобы не плодить)
async function cachedUrl(key) {
  if (objUrls.has(key)) return objUrls.get(key);
  const blob = await idbGet("blobs", key).catch(() => null);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  objUrls.set(key, u);
  return u;
}
let offlineIds = new Set(); // id артов, у которых есть офлайн-копия
async function refreshOfflineIndex() {
  const keys = await idbKeys("blobs");
  offlineIds = new Set(keys.filter((k) => String(k).startsWith("t")).map((k) => Number(String(k).slice(1))));
}

function toast(msg, ms = 2500) {
  $("toast").textContent = msg;
  $("toast").classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $("toast").classList.add("hidden"), ms);
}

async function api(path) {
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(path + sep + "token=" + encodeURIComponent(TOKEN));
  if (r.status === 403) { showSetup(); throw new Error("токен не подошёл"); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function showSetup() {
  $("setup").classList.remove("hidden");
}
$("tok-save").addEventListener("click", async () => {
  TOKEN = $("tok").value.trim();
  if (!TOKEN) return;
  localStorage.setItem("fm_token", TOKEN);
  try {
    await api("/api/collections");
    $("setup").classList.add("hidden");
    boot();
  } catch { toast("Не подключилось — проверь токен и что ПК включён"); }
});

function mediaUrl(id) { return "/media/" + id + "?token=" + encodeURIComponent(TOKEN); }
function thumbUrl(id) { return "/thumb/" + id + "?token=" + encodeURIComponent(TOKEN); }

// ПК недоступен — подставляем офлайн-копию из IndexedDB
window.fmImgFallback = async function (img) {
  img.classList.add("ld");
  if (!img.dataset.ck || img.dataset.tried) return;
  img.dataset.tried = "1";
  let u = await cachedUrl(img.dataset.ck);
  // Для полного фото нет копии — пробуем хотя бы миниатюру
  if (!u && img.dataset.ck.startsWith("m")) u = await cachedUrl("t" + img.dataset.ck.slice(1));
  if (u) img.src = u;
};

// Скачивание текущего вида в офлайн-копию
async function downloadOffline() {
  const label = $("col").selectedOptions[0] ? $("col").selectedOptions[0].textContent : "Все";
  let items = [];
  try {
    let url = `/api/files?offset=0&limit=500` + sortQuery();
    const q = $("q").value.trim();
    if (q) url += "&search=" + encodeURIComponent(q);
    if ($("col").value) url += "&collection=" + $("col").value;
    if ($("nsfw").value) url += "&nsfw=" + $("nsfw").value;
    items = await api(url);
  } catch { toast("Нет связи с ПК — скачивать нечего"); return; }
  if (!items.length) { toast("В этом виде нет артов"); return; }

  const vids = items.filter((f) => f.kind === "video").length;
  if (!confirm(
    `Сохранить «${label}» на телефон для офлайна?\n\n` +
    `Артов: ${items.length}${vids ? ` (из них видео: ${vids} — для них сохраню только превью)` : ""}.\n` +
    `Займёт место в памяти телефона.`
  )) return;

  let done = 0, err = 0;
  for (const f of items) {
    toast(`Сохраняю офлайн ${done + err + 1} из ${items.length}…`, 600000);
    try {
      const tb = await (await fetch(thumbUrl(f.id))).blob();
      await idbPut("blobs", "t" + f.id, tb);
      if (f.kind !== "video") { // видео целиком не тянем — тяжело для телефона
        const mb = await (await fetch(mediaUrl(f.id))).blob();
        await idbPut("blobs", "m" + f.id, mb);
      }
      done++;
    } catch { err++; }
  }
  await idbPut("meta", "pack", { label, items, at: Date.now() });
  await refreshOfflineIndex();
  toast(`Офлайн-копия готова: ${done}${err ? `, ошибок: ${err}` : ""}`, 4000);
  loadMore(true);
}

async function clearOffline() {
  if (!confirm("Удалить офлайн-копию с телефона?")) return;
  const keys = await idbKeys("blobs");
  for (const k of keys) await idbDel("blobs", k);
  await idbDel("meta", "pack");
  for (const u of objUrls.values()) URL.revokeObjectURL(u);
  objUrls.clear();
  offlineIds = new Set();
  toast("Офлайн-копия удалена");
  loadMore(true);
}

$("offline").addEventListener("click", async () => {
  const pack = await idbGet("meta", "pack").catch(() => null);
  if (pack && offlineIds.size) {
    // Уже что-то сохранено — предлагаем обновить или удалить
    if (confirm(`Офлайн-копия: «${pack.label}», артов ${offlineIds.size}.\n\nОК — обновить/дополнить, Отмена — удалить.`)) {
      downloadOffline();
    } else {
      clearOffline();
    }
  } else {
    downloadOffline();
  }
});

async function loadMore(reset = false) {
  if (st.loading) return;
  if (reset) { st.offset = 0; st.end = false; st.items = []; $("grid").innerHTML = ""; }
  if (st.end) return;
  st.loading = true;
  $("status").textContent = "Загружаю…";
  try {
    let url = `/api/files?offset=${st.offset}&limit=${st.limit}` + sortQuery();
    const q = $("q").value.trim();
    if (q) url += "&search=" + encodeURIComponent(q);
    if ($("col").value) url += "&collection=" + $("col").value;
    if ($("nsfw").value) url += "&nsfw=" + $("nsfw").value;
    const batch = await api(url);
    if (batch.length < st.limit) st.end = true;
    st.offset += batch.length;
    const start = st.items.length;
    st.items.push(...batch);
    $("grid").insertAdjacentHTML("beforeend", batch.map((f, k) => {
      const i = start + k;
      const badge = (f.group_count > 1)
        ? `<div class="b">🧩 ${f.group_count}</div>`
        : f.kind === "video" ? `<div class="b">▶</div>` : f.kind === "animation" ? `<div class="b">GIF</div>` : "";
      const inner = (f.kind === "video" && !f.has_thumb)
        ? `<div class="ph">🎬</div>`
        : `<img loading="lazy" decoding="async" data-ck="t${f.id}" onload="this.classList.add('ld')" onerror="fmImgFallback(this)" src="${thumbUrl(f.id)}" alt=""/>`;
      const off = offlineIds.has(f.id) ? `<div class="b off">⤓</div>` : "";
      return `<div class="c" data-i="${i}">${inner}${badge}${off}</div>`;
    }).join(""));
    $("status").textContent = st.items.length
      ? (st.end ? `${st.items.length} арт(ов)` : "")
      : "Ничего не нашлось";
  } catch (e) {
    // ПК недоступен — показываем офлайн-копию, если она есть
    const pack = await idbGet("meta", "pack").catch(() => null);
    const hasPack = pack && pack.items && pack.items.length;
    if (reset && hasPack) {
      st.items = pack.items;
      st.end = true;
      st.offset = pack.items.length;
      $("grid").innerHTML = pack.items.map((f, k) => {
        const badge = (f.group_count > 1)
          ? `<div class="b">🧩 ${f.group_count}</div>`
          : f.kind === "video" ? `<div class="b">▶</div>` : f.kind === "animation" ? `<div class="b">GIF</div>` : "";
        const inner = (f.kind === "video" && !f.has_thumb)
          ? `<div class="ph">🎬</div>`
          : `<img loading="lazy" decoding="async" data-ck="t${f.id}" onload="this.classList.add('ld')" onerror="fmImgFallback(this)" src="${thumbUrl(f.id)}" alt=""/>`;
        return `<div class="c" data-i="${k}">${inner}${badge}<div class="b off">⤓</div></div>`;
      }).join("");
      $("status").textContent = `📴 ПК недоступен — показываю офлайн-копию «${pack.label}» (${pack.items.length}). ↻ обновит, когда будет связь.`;
    } else if (hasPack) {
      st.end = true; // догрузка без сети — офлайн-копия уже показана
    } else {
      // Нет офлайн-копии именно на этом адресе (origin). Частая причина:
      // арты качали на LAN-странице, а это Tailscale-адрес — хранилище своё.
      $("grid").innerHTML = "";
      $("status").textContent =
        "📴 Нет связи с ПК. Офлайн-копии на этом устройстве ещё нет — подключись (включи Tailscale) и нажми ⤓, чтобы скачать арты для офлайна.";
    }
  } finally {
    st.loading = false;
  }
}

// Просмотр «как в Фото»: слайды едут за пальцем, внизу плёнка миниатюр
let vIndex = -1;
let lockY = 0;
// Группа (комикс/вариации): просмотр листает её страницы вместо ленты
let vGroup = null; // { id, files } | null
let vCell = -1;    // индекс обложки в st.items (для анимации в ячейку)
const vItems = () => (vGroup ? vGroup.files : st.items);
const W = () => window.innerWidth;
const track = () => $("vtrack");

// Блокируем прокрутку ленты под открытым артом (iOS иначе скроллит фон)
function lockScroll() {
  lockY = window.scrollY;
  document.body.classList.add("locked");
  document.body.style.top = -lockY + "px";
}
function unlockScroll() {
  document.body.classList.remove("locked");
  document.body.style.top = "";
  window.scrollTo(0, lockY);
}

function slideHtml(f, current) {
  if (!f) return "";
  if (f.kind === "video") {
    // Видео живёт только на текущем слайде; у соседей — превью (не грузим зря)
    return current
      ? `<video src="${mediaUrl(f.id)}" controls autoplay playsinline loop></video>`
      : (f.has_thumb ? `<img src="${thumbUrl(f.id)}" alt=""/>` : `<div style="font-size:56px">🎬</div>`);
  }
  // Текущий слайд: миниатюра как фон — мгновенная картинка, пока грузится полное фото
  const bg = current ? ` style="background:#0d0d12 url('${thumbUrl(f.id)}') center/contain no-repeat"` : "";
  return `<img${bg} data-ck="m${f.id}" onerror="fmImgFallback(this)" src="${mediaUrl(f.id)}" alt=""/>`;
}

function setTrack(dx, animate, dy = 0) {
  const t = track();
  t.style.transition = animate ? "transform .28s cubic-bezier(.2,.8,.2,1)" : "none";
  t.style.transform = `translate(${-W() + dx}px, ${dy}px)`;
}

// ---- Зум текущего слайда (пинч + двойной тап, как в Фото) ----
const zm = { s: 1, x: 0, y: 0 };
function media() { return track().children[1] ? track().children[1].firstElementChild : null; }
function applyZm(animate) {
  const el = media();
  if (!el) return;
  el.style.transition = animate ? "transform .25s cubic-bezier(.2,.8,.2,1)" : "none";
  el.style.transform = `translate(${zm.x}px, ${zm.y}px) scale(${zm.s})`;
}
function resetZm() { zm.s = 1; zm.x = 0; zm.y = 0; }
// До каких пределов можно двигать увеличенный арт (его края ↔ края экрана)
function zmBounds() {
  const el = media();
  if (!el) return { mx: 0, my: 0 };
  return {
    mx: Math.max(0, (el.offsetWidth * zm.s - W()) / 2),
    my: Math.max(0, (el.offsetHeight * zm.s - window.innerHeight) / 2),
  };
}
function clampZm() {
  const { mx, my } = zmBounds();
  zm.x = Math.min(mx, Math.max(-mx, zm.x));
  zm.y = Math.min(my, Math.max(-my, zm.y));
}

// Прямоугольник, в котором арт реально показывается (contain внутри экрана).
// Используем известные размеры из БД, чтобы задать слайду точный размер ДО
// загрузки картинки — иначе после подгрузки арт «прыгает» на место.
function fitRect(f) {
  const vw = W(), vh = window.innerHeight;
  const ar = (f && f.width && f.height) ? f.width / f.height : null;
  if (!ar) return { left: 0, top: 0, width: vw, height: vh };
  let w = vw, h = vw / ar;
  if (h > vh) { h = vh; w = vh * ar; }
  return { left: (vw - w) / 2, top: (vh - h) / 2, width: w, height: h };
}
function sizeCurrentMedia() {
  const el = media();
  const f = vItems()[vIndex];
  if (!el) return;
  if (el.tagName === "IMG" && f && f.width && f.height) {
    const r = fitRect(f);
    el.style.width = r.width + "px";
    el.style.height = r.height + "px";
  } else {
    el.style.width = "";
    el.style.height = "";
  }
}

function renderSlides() {
  const s = track().children;
  s[0].innerHTML = slideHtml(vItems()[vIndex - 1], false);
  s[1].innerHTML = slideHtml(vItems()[vIndex], true);
  s[2].innerHTML = slideHtml(vItems()[vIndex + 1], false);
  // Прячем плёнку миниатюр, если текущий слайд — видео (не мешаем перемотке)
  const cur = vItems()[vIndex];
  $("viewer").classList.toggle("on-video", !!cur && cur.kind === "video");
  resetZm(); // новый арт — зум по умолчанию
  setTrack(0, false);
  sizeCurrentMedia(); // фиксируем размер — картинка не прыгнет после загрузки
}

// Плёнка миниатюр внизу — тап переносит к арту
function renderStrip() {
  $("vstrip").innerHTML = vItems().map((f, i) => {
    const cls = i === vIndex ? "on" : "";
    return (f.kind === "video" && !f.has_thumb)
      ? `<div class="vph ${cls}" data-i="${i}">🎬</div>`
      : `<img loading="lazy" class="${cls}" data-i="${i}" src="${thumbUrl(f.id)}" alt=""/>`;
  }).join("");
  centerStrip(false);
}
function updateStrip() {
  const strip = $("vstrip");
  if (strip.children.length !== vItems().length) return renderStrip();
  [...strip.children].forEach((el, i) => el.classList.toggle("on", i === vIndex));
  centerStrip(true);
}
function centerStrip(smooth) {
  const el = $("vstrip").children[vIndex];
  if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: smooth ? "smooth" : "auto" });
}
$("vstrip").addEventListener("click", (e) => {
  const el = e.target.closest("[data-i]");
  if (el) showAt(Number(el.dataset.i));
});

// Фоновая лента едет за открытым артом — при закрытии он «встанет» в свою ячейку
function cellEl() {
  const i = vGroup ? vCell : vIndex; // у группы одна ячейка — обложка
  return document.querySelector(`#grid .c[data-i="${i}"]`);
}
function ensureCellVisible() {
  const el = cellEl();
  if (!el) return;
  const r = el.getBoundingClientRect();
  const docTop = r.top + lockY; // позиция ячейки в документе (тело зафиксировано)
  const maxY = Math.max(0, document.body.scrollHeight - window.innerHeight);
  lockY = Math.min(maxY, Math.max(0, docTop - (window.innerHeight - r.height) / 2));
  document.body.style.top = -lockY + "px";
}

function showAt(i) {
  const f = vItems()[i];
  if (!f) return;
  const opening = vIndex < 0;
  vIndex = i;
  if (opening) {
    lockScroll();
    $("viewer").classList.remove("hidden");
    renderStrip();
  }
  $("viewer").style.backgroundColor = "";
  renderSlides();
  updateStrip();
  // При открытии ячейка и так на виду — не дёргаем фон (важно для анимации);
  // при листании внутри просмотрщика — ведём ленту за собой.
  if (!opening) ensureCellVisible();
  if (!vGroup && i >= st.items.length - 5) loadMore();
}

// Показать/спрятать панели просмотрщика (пока летит арт)
function setChrome(v) {
  const o = v ? "" : "0";
  track().style.opacity = o;
  $("vstrip").style.opacity = o;
  $("vclose").style.opacity = o;
  $("vdl").style.opacity = o;
}

// Отображение панелей (только видимость; ленту-трек не трогаем — на нём арт)
function setPanels(v) {
  const o = v ? "" : "0";
  $("vstrip").style.opacity = o;
  $("vclose").style.opacity = o;
  $("vdl").style.opacity = o;
}

// Трансформ, переносящий текущий арт в прямоугольник ячейки (origin — центр).
function cellTransform(el, cell) {
  const R = el.getBoundingClientRect();
  const C = cell.getBoundingClientRect();
  const s = Math.min(C.width / R.width, C.height / R.height) || 0.1;
  const dx = (C.left + C.width / 2) - (R.left + R.width / 2);
  const dy = (C.top + C.height / 2) - (R.top + R.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${s})`;
}

// Открытие «из ячейки»: анимируем сам арт (без отдельного элемента), поэтому
// в конце он оказывается ровно на своём месте — никаких подскоков.
async function openFrom(i) {
  const f = st.items[i];
  const cell = document.querySelector(`#grid .c[data-i="${i}"]`);
  if (!f || !cell) return showAt(i);

  // Стопка: подгружаем страницы группы и листаем их
  vGroup = null;
  vCell = -1;
  if (f.group_count > 1 && f.group_id) {
    try {
      const g = await api("/api/group?id=" + f.group_id);
      if (g.files && g.files.length > 1) {
        vGroup = { id: g.id, files: g.files };
        vCell = i;
      }
    } catch {}
  }
  vIndex = vGroup ? 0 : i; // группа всегда открывается с первой страницы
  lockScroll();
  $("vstrip").style.display = "";
  $("viewer").classList.remove("hidden");
  renderStrip();
  renderSlides();
  updateStrip();
  const el = media();
  if (!el) { $("viewer").style.backgroundColor = ""; return; }

  setPanels(false);
  el.style.transition = "none";
  el.style.transform = cellTransform(el, cell); // старт — в ячейке
  $("viewer").style.transition = "background-color .3s";
  $("viewer").style.backgroundColor = "rgba(8,8,12,0)";
  // reflow, чтобы стартовый transform применился до анимации
  void el.offsetWidth;
  requestAnimationFrame(() => {
    el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)";
    el.style.transform = "translate(0px, 0px) scale(1)";
    $("viewer").style.backgroundColor = "rgba(8,8,12,1)";
  });
  setTimeout(() => {
    el.style.transition = "";
    setPanels(true);
    $("viewer").style.transition = "";
    $("viewer").style.backgroundColor = "";
  }, 320);
}

function closeViewer() {
  $("viewer").classList.add("hidden");
  for (const s of track().children) s.innerHTML = ""; // останавливает видео
  $("viewer").style.backgroundColor = "";
  setTrack(0, false);
  vIndex = -1;
  vGroup = null;
  vCell = -1;
  unlockScroll();
}

// Жесты: горизонталь — листание, вертикаль вниз — закрытие с затуханием
const g = { x: 0, y: 0, axis: null, active: false };

function once(fn, ms) {
  // transitionend + страховка таймером (не всегда стреляет)
  let fired = false;
  const run = () => { if (!fired) { fired = true; fn(); } };
  track().addEventListener("transitionend", run, { once: true });
  setTimeout(run, ms);
}

function animateTo(dir) { // dir = -1: к следующему (трек уезжает влево)
  once(() => {
    vIndex += dir === -1 ? 1 : -1;
    renderSlides();
    updateStrip();
    ensureCellVisible();
    if (!vGroup && vIndex >= st.items.length - 5) loadMore();
  }, 330);
  setTrack(dir === -1 ? -W() : W(), true);
}

// Закрытие «как в Фото»: арт сжимается и встаёт в свою ячейку.
function animateClose() {
  const el = media();
  const cell = cellEl();
  if (!el || !cell) { closeViewer(); return; }
  // Плёнку убираем сразу (иначе её тёмная полоса «мигает» внизу при закрытии)
  $("vstrip").style.display = "none";
  $("vclose").style.opacity = "0";
  $("vdl").style.opacity = "0";
  // При зуме сначала мягко приводим к базовому масштабу, чтобы transform был корректным
  if (zm.s !== 1 || zm.x || zm.y) { resetZm(); applyZm(false); void el.offsetWidth; }
  const target = cellTransform(el, cell);
  el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)";
  el.style.transform = target;
  $("viewer").style.transition = "background-color .3s";
  $("viewer").style.backgroundColor = "rgba(8,8,12,0)";
  setTimeout(() => {
    closeViewer();
    $("viewer").style.transition = "";
    setPanels(true);
    $("vstrip").style.display = "";
  }, 320);
}

// Режимы: detect (ещё не решили), h (листание), v (закрытие),
// pinch (двумя пальцами), pan (двигаем увеличенный арт)
Object.assign(g, { mode: null, d0: 0, s0: 1, zx0: 0, zy0: 0, hx: 0, vy: 0, lastTap: 0 });

$("viewer").addEventListener("touchstart", (e) => {
  if (e.target.closest("#vstrip, button")) { g.mode = null; return; }
  if (e.touches.length === 2) {
    const el = media();
    if (!el || el.tagName !== "IMG") { g.mode = null; return; } // видео не зумим
    e.preventDefault(); // нативный пинч страницы — выключен
    const [a, b] = e.touches;
    g.mode = "pinch";
    g.d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
    g.s0 = zm.s;
    g.x = (a.clientX + b.clientX) / 2;
    g.y = (a.clientY + b.clientY) / 2;
    return;
  }
  if (e.touches.length !== 1 || e.target.closest("video")) { g.mode = null; return; }
  g.x = e.touches[0].clientX;
  g.y = e.touches[0].clientY;
  g.zx0 = zm.x;
  g.zy0 = zm.y;
  g.hx = 0;
  g.vy = 0;
  g.mode = zm.s > 1 ? "pan" : "detect";
}, { passive: false });

$("viewer").addEventListener("touchmove", (e) => {
  if (!g.mode) return;

  if (g.mode === "pinch") {
    e.preventDefault();
    if (e.touches.length < 2) return;
    const [a, b] = e.touches;
    const el = media();
    if (!el) return;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
    const mx = (a.clientX + b.clientX) / 2;
    const my = (a.clientY + b.clientY) / 2;
    const next = Math.min(6, Math.max(1, g.s0 * d / g.d0));
    // Якорим точку между пальцами (как zoomAt на ПК) + пан серединой щипка
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const k = next / zm.s;
    zm.x += (mx - cx) * (1 - k) + (mx - g.x);
    zm.y += (my - cy) * (1 - k) + (my - g.y);
    zm.s = next;
    g.x = mx;
    g.y = my;
    clampZm();
    applyZm(false);
    return;
  }

  const dx = e.touches[0].clientX - g.x;
  const dy = e.touches[0].clientY - g.y;

  if (g.mode === "pan") {
    e.preventDefault();
    const { mx, my } = zmBounds();
    let nx = g.zx0 + dx;
    let ny = g.zy0 + dy;
    // Излишек за границей арта = начало листания / закрытия
    let ex = 0;
    if (nx > mx) { ex = nx - mx; nx = mx; }
    else if (nx < -mx) { ex = nx + mx; nx = -mx; }
    let ey = 0;
    if (ny > my) { ey = ny - my; ny = my; } // упёрлись в верх арта, тянем дальше вниз
    else if (ny < -my) { ny = -my; }
    zm.x = nx;
    zm.y = ny;
    applyZm(false);
    if (Math.abs(ex) > ey) {
      g.hx = ex; g.vy = 0;
      setTrack(ex, false);
      $("viewer").style.backgroundColor = "";
    } else if (ey > 0) {
      g.vy = ey; g.hx = 0;
      setTrack(0, false, ey);
      $("viewer").style.backgroundColor = `rgba(8,8,12,${Math.max(0.15, 1 - ey / 420)})`;
    } else {
      g.hx = 0; g.vy = 0;
      setTrack(0, false);
    }
    return;
  }

  // Обычный режим (без зума)
  if (g.mode === "detect") {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    g.mode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  }
  e.preventDefault();
  if (g.mode === "h") {
    let x = dx;
    if ((dx > 0 && vIndex === 0) || (dx < 0 && vIndex >= vItems().length - 1)) x = dx * 0.3;
    setTrack(x, false);
  } else if (g.mode === "v") {
    const y = dy > 0 ? dy : dy * 0.2;
    setTrack(0, false, y);
    $("viewer").style.backgroundColor = `rgba(8,8,12,${Math.max(0.15, 1 - Math.max(0, dy) / 420)})`;
  }
}, { passive: false });

$("viewer").addEventListener("touchend", (e) => {
  const mode = g.mode;
  if (!mode) return;
  if (e.touches.length > 0 && mode === "pinch") return; // ещё один палец на экране

  if (mode === "pinch") {
    g.mode = null;
    if (zm.s <= 1.05) { resetZm(); applyZm(true); } // почти 1 — защёлкиваем в исходное
    return;
  }
  g.mode = null;
  const dx = e.changedTouches[0].clientX - g.x;
  const dy = e.changedTouches[0].clientY - g.y;

  if (mode === "pan") {
    const thr = Math.min(110, W() / 4);
    if (g.hx < -thr && vIndex < vItems().length - 1) return animateTo(-1); // зум сбросит renderSlides
    if (g.hx > thr && vIndex > 0) return animateTo(1);
    if (g.vy > 130) return animateClose();
    setTrack(0, true);
    $("viewer").style.backgroundColor = "";
    return;
  }

  if (mode === "detect") {
    // Двойной тап — зум к точке (и обратно)
    const now = Date.now();
    if (now - g.lastTap < 300) {
      g.lastTap = 0;
      const el = media();
      if (el && el.tagName === "IMG") {
        if (zm.s > 1) { resetZm(); }
        else {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          zm.s = 2.5;
          zm.x = (cx - e.changedTouches[0].clientX) * 1.5;
          zm.y = (cy - e.changedTouches[0].clientY) * 1.5;
          clampZm();
        }
        applyZm(true);
      }
    } else {
      g.lastTap = now;
    }
    return;
  }

  if (mode === "h") {
    const go = Math.abs(dx) > Math.min(110, W() / 4);
    if (go && dx < 0 && vIndex < vItems().length - 1) return animateTo(-1);
    if (go && dx > 0 && vIndex > 0) return animateTo(1);
    setTrack(0, true); // не долистнул — пружиним назад
  } else if (mode === "v") {
    if (dy > 130) return animateClose();
    setTrack(0, true);
    $("viewer").style.backgroundColor = "";
  }
});

// Сохранение на телефон: iOS — через системный шаринг («Сохранить изображение»),
// Android и прочие — обычное скачивание в «Загрузки».
$("vdl").addEventListener("click", async () => {
  const f = vItems()[vIndex];
  if (!f) return;
  const name = `art-${f.id}.${f.ext}`;
  try {
    const blob = await (await fetch(mediaUrl(f.id))).blob();
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  } catch (e) {
    if (e && e.name === "AbortError") return; // пользователь закрыл шаринг
    toast("Не удалось сохранить: " + (e.message || e));
  }
});

$("grid").addEventListener("click", (e) => {
  const c = e.target.closest(".c");
  if (!c) return;
  openFrom(Number(c.dataset.i));
});
$("vclose").addEventListener("click", animateClose); // тоже «встаёт» в ячейку

// Поиск и фильтры
let qTimer = null;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => loadMore(true), 400);
});
$("col").addEventListener("change", () => loadMore(true));
$("nsfw").addEventListener("change", () => loadMore(true));
// Порядок артов: зерно для «случайно» держим постоянным, иначе при подгрузке
// страниц выдача перемешивается и арты дублируются.
let randSeed = 1 + Math.floor(Math.random() * 2000000000);
function sortQuery() {
  const s = $("sort").value;
  if (!s) return "";
  return "&sort=" + s + (s === "random" ? "&seed=" + randSeed : "");
}
$("sort").addEventListener("change", () => {
  if ($("sort").value === "random") randSeed = 1 + Math.floor(Math.random() * 2000000000);
  try { localStorage.setItem("fm_sort", $("sort").value); } catch {}
  loadMore(true);
});
// Обновление: подтянуть изменения с ПК (удалённые/новые арты, коллекции)
$("refresh").addEventListener("click", async () => {
  $("refresh").style.transform = "rotate(360deg)";
  $("refresh").style.transition = "transform .5s";
  setTimeout(() => { $("refresh").style.transition = ""; $("refresh").style.transform = ""; }, 520);
  // обновим и счётчики коллекций
  try { refillCollections(await api("/api/collections")); } catch {}
  loadMore(true);
});

function optEl(v, t) { const o = document.createElement("option"); o.value = v; o.textContent = t; return o; }
function refillCollections(cols) {
  const cur = $("col").value;
  $("col").replaceChildren(
    optEl("", "📚 Все"),
    optEl("-1", "📥 Без коллекции"),
    ...cols.map((c) => optEl(String(c.id), `${c.name} (${c.count})`)),
  );
  $("col").value = cur;
}

// Бесконечная прокрутка
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) loadMore();
});

// Загрузка файлов с телефона
$("add-file").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async () => {
  const files = [...$("file").files];
  if (!files.length) return;
  let done = 0, err = 0;
  for (const f of files) {
    const mb = f.size / (1024 * 1024);
    toast(`Отправляю ${done + err + 1} из ${files.length}… (${mb.toFixed(mb < 10 ? 1 : 0)} МБ)`, 600000);
    try {
      // Расширение: сначала из имени файла (IMG_1234.MOV), иначе из MIME
      const fromName = (f.name.split(".").pop() || "").toLowerCase();
      const fromType = (f.type.split("/")[1] || "").toLowerCase();
      const ext = (fromName && fromName.length <= 5) ? fromName : (fromType || "bin");
      // Файл отправляем ПОТОКОМ (без base64 в памяти) — иначе большие видео
      // с телефона роняли вкладку
      const r = await fetch(
        `/ingest-raw?token=${encodeURIComponent(TOKEN)}&ext=${encodeURIComponent(ext)}`,
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f }
      );
      if (r.ok) done++; else err++;
    } catch { err++; }
  }
  $("file").value = "";
  toast(`Отправлено: ${done}` + (err ? `, ошибок: ${err}` : ""), 4000);
  pollForNew(); // лента обновится, когда ПК закончит импорт
});

// Ждём появления новых артов на ПК (скачивание/импорт занимает время)
let pollTimer = null;
async function topId() {
  try {
    const r = await api("/api/files?offset=0&limit=1");
    return r.length ? r[0].id : 0;
  } catch { return -1; }
}
async function pollForNew(tries = 30) {
  clearInterval(pollTimer);
  const before = await topId();
  let left = tries;
  pollTimer = setInterval(async () => {
    if (--left <= 0) { clearInterval(pollTimer); return; }
    const now = await topId();
    if (now >= 0 && now !== before) {
      clearInterval(pollTimer);
      if (vIndex < 0) { // не дёргаем ленту под открытым просмотрщиком
        toast("Появилось новое — обновляю ✓");
        loadMore(true);
      }
    }
  }, 4000);
}

// Добавление по ссылке (скачает ПК через gallery-dl, с тегами)
$("add-link").addEventListener("click", async () => {
  const url = prompt("Ссылка на арт (e621, FurAffinity, Twitter…):");
  if (!url || !url.trim()) return;
  try {
    const r = await fetch("/ingest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, url: url.trim() }),
    });
    toast(r.ok ? "Отправлено — ПК скачает и добавит ✓" : "Не получилось (HTTP " + r.status + ")");
    if (r.ok) pollForNew(); // лента обновится сама, когда скачается
  } catch { toast("Нет связи с ПК"); }
});

async function boot() {
  attachManifest();
  registerSW();
  try {
    const s = localStorage.getItem("fm_sort");
    if (s) $("sort").value = s;
  } catch {}
  await refreshOfflineIndex().catch(() => {});
  try {
    // Стартовый фильтр — тот же, что настроен на ПК («Фильтр при запуске»)
    const cfg = await api("/api/config");
    if (cfg.nsfw_split && cfg.default_nsfw !== null && cfg.default_nsfw !== undefined) {
      $("nsfw").value = String(cfg.default_nsfw);
    }
    if (!cfg.nsfw_split) $("nsfw").classList.add("hidden"); // вкладки выключены — не мешаем
  } catch { /* setup уже показан при 403 */ }
  try { refillCollections(await api("/api/collections")); } catch {}
  loadMore(true);
}

if (!TOKEN) showSetup();
else boot();
</script>
