[package]
name = "furrymanager"
version = "0.6.0"
edition = "2021"
description = "Локальный менеджер фурри-артов и референсов"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
image = { version = "0.24", features = ["webp"] }
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
dirs = "5"
tiny_http = "0.12"
base64 = "0.22"
notify = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
md-5 = "0.10"
zip = { version = "0.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
strip = true
