<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font: 13px/1.4 "Segoe UI", sans-serif; background: #1e1e26; color: #e8e6e3; width: 260px; margin: 0; padding: 14px; }
    h3 { margin: 0 0 10px; color: #f28c38; font-size: 14px; }
    button { display: block; width: 100%; margin-top: 8px; padding: 9px 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; text-align: left; }
    #save { background: #f28c38; color: #1b1206; font-weight: 600; }
    #options { background: #262631; color: #e8e6e3; border: 1px solid #3a3a46; }
    #status { margin-top: 10px; font-size: 12px; color: #9a97a3; min-height: 16px; }
    .warn { color: #e0a95d; }
  </style>
</head>
<body>
  <h3>🦊 FurryManager</h3>
  <button id="save">💾 Сохранить эту страницу</button>
  <button id="options">⚙️ Настройки (токен, порт)</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
